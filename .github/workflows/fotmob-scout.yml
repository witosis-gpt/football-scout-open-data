name: FotMob Scout Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'fotmob_scout_harvester.py'
      - '.github/workflows/fotmob-scout.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade LanusStats pandas openpyxl nodriver
      - name: Run FotMob scouting harvester
        run: python fotmob_scout_harvester.py
      - name: Upload scouting output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotmob-scout-output
          path: output
          if-no-files-found: warn
