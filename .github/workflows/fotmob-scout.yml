name: Transfermarkt Open Scout Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'transfermarkt_open_harvester.py'
      - '.github/workflows/fotmob-scout.yml'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      - name: Download verified open football dataset
        run: |
          mkdir -p external/football-datasets/datalake/transfermarkt/player_performances
          mkdir -p external/football-datasets/datalake/transfermarkt/player_profiles
          mkdir -p external/football-datasets/datalake/transfermarkt/player_latest_market_value
          curl -L --fail --retry 3 -o external/football-datasets/datalake/transfermarkt/player_performances/player_performances.csv https://media.githubusercontent.com/media/salimt/football-datasets/main/datalake/transfermarkt/player_performances/player_performances.csv
          curl -L --fail --retry 3 -o external/football-datasets/datalake/transfermarkt/player_profiles/player_profiles.csv https://raw.githubusercontent.com/salimt/football-datasets/main/datalake/transfermarkt/player_profiles/player_profiles.csv
          curl -L --fail --retry 3 -o external/football-datasets/datalake/transfermarkt/player_latest_market_value/player_latest_market_value.csv https://raw.githubusercontent.com/salimt/football-datasets/main/datalake/transfermarkt/player_latest_market_value/player_latest_market_value.csv
          ls -lh external/football-datasets/datalake/transfermarkt/player_performances/player_performances.csv
      - name: Build scouting dataset
        run: python transfermarkt_open_harvester.py
      - name: Publish latest scouting data to repository
        if: always()
        run: |
          rm -rf data/latest
          mkdir -p data/latest
          if [ -d output_transfermarkt ]; then
            cp -f output_transfermarkt/*.csv data/latest/ 2>/dev/null || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest
          if git diff --cached --quiet; then
            echo "No new scouting data to commit"
          else
            git commit -m "Update latest Transfermarkt open scouting data"
            git push
          fi
      - name: Upload scouting output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfermarkt-open-scout-output
          path: output_transfermarkt
          if-no-files-found: warn
