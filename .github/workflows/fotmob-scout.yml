name: FotMob Scout Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'fotmob_scout_harvester_v2.py'
      - '.github/workflows/fotmob-scout.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade LanusStats pandas openpyxl nodriver
      - name: Run FotMob scouting harvester v2
        run: python fotmob_scout_harvester_v2.py
      - name: Publish latest scouting data to repository
        if: always()
        run: |
          mkdir -p data/latest
          if [ -d output_v2 ]; then
            cp -f output_v2/*.csv data/latest/ 2>/dev/null || true
            cp -f output_v2/*.xlsx data/latest/ 2>/dev/null || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest
          if git diff --cached --quiet; then
            echo "No new scouting data to commit"
          else
            git commit -m "Update latest FotMob scouting data v2"
            git push
          fi
      - name: Upload scouting output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotmob-scout-output-v2
          path: output_v2
          if-no-files-found: warn
